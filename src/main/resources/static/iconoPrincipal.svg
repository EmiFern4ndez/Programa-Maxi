<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%">
  <defs>
    <!-- Degradados para las barras de métricas -->
    <linearGradient id="sismax-slate" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="sismax-blue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="sismax-emerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Resplandor sutil para el check/escudo -->
    <filter id="sismax-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ISOTIPO / EMBLEMA -->
  <g transform="translate(10, 10)">
    <!-- Contenedor / Marco redondeado -->
    <rect x="0" y="0" width="90" height="90" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="2" />

    <!-- Barras de métricas patrimoniales -->
    <rect x="20" y="46" width="12" height="30" rx="3.5" fill="url(#sismax-slate)" />
    <rect x="39" y="34" width="12" height="42" rx="3.5" fill="url(#sismax-blue)" />
    <rect x="58" y="20" width="12" height="56" rx="3.5" fill="url(#sismax-emerald)" />

    <!-- Trazado en V (Checkmark/Shield Trendline) -->
    <path d="M 16 38 L 34 54 L 74 16" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#sismax-glow)" />
  </g>

  <!-- TIPOGRAFÍA Y MARCA -->
  <!-- Título SisMax -->
  <text x="120" y="58" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="42" 
        fill="#F8FAFC" 
        letter-spacing="-1">Sis<tspan fill="#38BDF8">Max</tspan></text>

  <!-- Subtítulo de categoría -->
  <text x="122" y="80" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="600" 
        font-size="11" 
        fill="#94A3B8" 
        letter-spacing="2">GESTIÓN PATRIMONIAL</text>
</svg>
